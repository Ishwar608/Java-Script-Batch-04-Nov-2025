    <script>
      // if conditional statement
      let age = 18;
      if (age >= 18) {
        console.log('You are an adult.');
      } else {
        console.log('You are a minor.');
      }

      // if...else if...else conditional statement
      let marks = 75;
      let totalMarks = 100;
      let percentage = (marks / totalMarks) * 100;
      if (percentage >= 90) {
        console.log('Grade: A');
      } else if (percentage >= 80) {
        console.log('Grade: B');
      } else if (percentage >= 70) {
        console.log('Grade: C');
      } else {
        console.log('Grade: F');
      }

      // switch conditional statement
      let day = 3;
      switch (day) {
        case 1:
          console.log('Monday');
          break;
        case 2:
          console.log('Tuesday');
          break;
        case 3:
          console.log('Wednesday');
          break;
        case 4:
          console.log('Thursday');
          break;
        case 5:
          console.log('Friday');
          break;
        case 6:
          console.log('Saturday');
          break;
        case 7:
          console.log('Sunday');
          break;
        default:
          console.log('Invalid day');
      }

      // Ternary Operator
      let isMember = false;
      let discount = isMember ? 0.1 : 0;
      console.log('Discount:', discount);
      console.log('Age is adult:', age >= 18 ? 'Yes' : 'No');
